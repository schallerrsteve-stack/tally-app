# Builds an installable debug APK on every push. Download it from the run's "Artifacts" section.
name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - name: Build web app
        run: npm run build
        env:
          # Your project's public address and publishable key (safe to include in the app)
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rwodweszrlvjgxgtpvxz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_QWCFBPRNjno3sVLe37CuSg_eDXZsJvZ' }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tally-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
