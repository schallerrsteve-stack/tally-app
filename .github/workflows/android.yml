# Builds an installable APK on every push to main and publishes it as the latest release.
# On your phone: github.com/schallerrsteve-stack/tally-app/releases/latest -> tap Tally.apk
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - name: Build web app
        run: npm run build
        env:
          # Your project's public address and publishable key (safe to include in the app)
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rwodweszrlvjgxgtpvxz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_QWCFBPRNjno3sVLe37CuSg_eDXZsJvZ' }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tally.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tally-debug-apk
          path: Tally.apk
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: >
          gh release create "$TAG" Tally.apk
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "Tally build ${{ github.run_number }}" --latest
          --notes "Install on Android: tap Tally.apk below, then Open. If asked, allow your browser to install unknown apps."
