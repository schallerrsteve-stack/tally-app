# Publishes the web version of Tally (for iPhones and browsers) to GitHub Pages on every push to main.
# Address: https://schallerrsteve-stack.github.io/tally-app/
name: Publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Build web app
        run: npm run build
        env:
          TALLY_BUILD: web
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rwodweszrlvjgxgtpvxz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_QWCFBPRNjno3sVLe37CuSg_eDXZsJvZ' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
